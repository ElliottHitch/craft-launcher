# Copy to .github/workflows/personal-release.yml in a reviewed ElliottHitch app fork.
# Replace REPLACE_WITH_REVIEWED_WORKFLOW_COMMIT with the full commit SHA that adds
# personal-windows.yml to ElliottHitch/craft-launcher. Change app-id to the app's
# asset stem. Review that app's packaging prerequisites before enabling its caller.
# The reusable workflow supplies the upstream font pin and craft-i18n.rev checkout.
name: Personal Windows release

on:
  workflow_dispatch:
    inputs:
      source-sha:
        description: Reviewed 40-character SHA, must equal the selected branch's current commit
        type: string
        required: true
      version:
        description: Reviewed Cargo.toml version, numeric X.Y.Z and newer than existing tags
        type: string
        required: true
      review-note:
        description: Source review reference and accepted findings for this exact commit
        type: string
        required: true

permissions:
  contents: read

jobs:
  draft:
    permissions:
      contents: write
    uses: ElliottHitch/craft-launcher/.github/workflows/personal-windows.yml@REPLACE_WITH_REVIEWED_WORKFLOW_COMMIT
    with:
      app-id: artcraft-launcher
      source-sha: ${{ inputs.source-sha }}
      version: ${{ inputs.version }}
      review-note: ${{ inputs.review-note }}
